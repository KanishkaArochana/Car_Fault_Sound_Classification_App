# Enable Gradle daemon (keeps the compiler daemon alive in the background)
org.gradle.daemon=true

# Enable parallel compilation for subprojects
org.gradle.parallel=true

# Enable the Gradle Build Cache (avoids rebuilding tasks whose inputs haven't changed)
org.gradle.caching=true

# Configure projects on demand
org.gradle.configureondemand=true

# Optimize JVM arguments. Setting -Xmx to 4G prevents disk thrashing/swapping on systems with limited RAM, 
# while enabling G1GC and String Deduplication reduces overhead.
org.gradle.jvmargs=-Xmx4G -XX:+UseG1GC -XX:MaxMetaspaceSize=1G -XX:+UseStringDeduplication -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true

# This newDsl flag was added by the Flutter template
android.newDsl=false

# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Enable incremental compilation for Kotlin
kotlin.incremental=true
