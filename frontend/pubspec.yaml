name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # Added for real microphone recording + backend API upload
  record: ^5.2.0
  http: ^1.2.2
  permission_handler: ^11.3.1
  image_picker: ^1.2.3
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/OBD Images/
    - assets/icons/
    - assets/dashboard_symbols/
    - lib/screens/dashbord_symbols/dashobord_symble.json
    - lib/screens/OBD_code_lookup/B_codes.json
    - lib/screens/OBD_code_lookup/C_codes.json
    - lib/screens/OBD_code_lookup/P_codes.json
    - lib/screens/OBD_code_lookup/U_codes.json

dependency_overrides:
  record_linux: ^1.1.0
